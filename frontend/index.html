<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Workbench</title>

    <!-- Design system tokens -->
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <link rel="stylesheet" href="/assets/css/grid-bg.css">
    <link rel="stylesheet" href="/assets/css/layout.css">
    <link rel="stylesheet" href="/assets/css/sticky-board.css">

    <!-- Component styles -->
    <link rel="stylesheet" href="/assets/css/radial-menu.css">
    <link rel="stylesheet" href="/assets/css/panel.css">
    <link rel="stylesheet" href="/assets/css/system-panels.css">
    <link rel="stylesheet" href="/assets/css/fan-menu.css">
    <link rel="stylesheet" href="/assets/css/color-wheel.css">
    <link rel="stylesheet" href="/assets/css/nav-dock.css">
</head>
<body>
    <div class="wb-canvas no-select" id="wb-canvas">
        <!-- Full-screen page iframe (background layer, behind panels) -->
        <iframe id="wb-page-frame" src="" frameborder="0"
                allow="scripts same-origin forms"
                style="position:absolute;inset:0;width:100%;height:100%;border:none;z-index:0;"></iframe>

        <!-- Startup hint, hidden once a page is loaded -->
        <div class="wb-hint" id="wb-hint">
            <div class="wb-hint-inner">
                <svg class="wb-hint-icon" width="22" height="22" viewBox="0 0 24 24"
                     fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                    <circle cx="12" cy="12" r="3"/>
                    <line x1="12" y1="3" x2="12" y2="9"/>
                    <line x1="12" y1="15" x2="12" y2="21"/>
                    <line x1="3" y1="12" x2="9" y2="12"/>
                    <line x1="15" y1="12" x2="21" y2="12"/>
                </svg>
                <p class="wb-hint-text">按中键唤出菜单 · Alt+中键切换页面</p>
            </div>
        </div>
    </div>

    <!--
        Event-capture layer: sits above the page iframe (z=1) but below panels
        and radial menu (z=10+, 500).  Normally pointer-events:none so the
        iframe receives all interactions.  app.js enables it briefly during
        right-click hold/drag so the parent page can receive mousemove/mouseup.
    -->
    <div id="wb-event-capture"
         style="position:fixed;inset:0;z-index:1;pointer-events:none;background:transparent;"></div>



    <!-- Application bootstrap -->
    <script type="module" src="/assets/js/core/app.js"></script>

    <!-- Dev hot reload (no-op in production) -->
    <script>
    (function () {
        var es = new EventSource('/dev/watch');
        es.onmessage = function (e) { if (e.data !== 'connected') location.reload(); };
        es.onerror   = function () { es.close(); };
    }());
    </script>
</body>
</html>
