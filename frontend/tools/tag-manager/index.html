<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>标签管理</title>
<link rel="stylesheet" href="/assets/css/variables.css">
<link rel="stylesheet" href="/assets/css/reset.css">
<link rel="stylesheet" href="/assets/css/base.css">
<style>
*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
    background: var(--bg-canvas, #fefce8);
    color: var(--text, #1e2130);
    font-family: var(--font-ui, system-ui, sans-serif);
    font-size: var(--fs-base, 13px);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* ── Header ──────────────────────────────────────────────────── */
.tm-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border, #e4e7ed);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
}

.tm-header h1 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text, #1e2130);
    flex: 1;
}

.tm-count {
    font-size: 12px;
    color: var(--muted, #8492a6);
    background: rgba(0,0,0,0.06);
    border-radius: 10px;
    padding: 2px 9px;
}

/* ── Toolbar / Create row ────────────────────────────────────── */
.tm-toolbar {
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 10px 20px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.6);
    border-bottom: 1px solid var(--border, #e4e7ed);
}

.tm-toolbar-row {
    display: flex;
    align-items: center;
    gap: 8px;
}

.tm-input {
    flex: 1;
    height: 32px;
    padding: 0 10px;
    border: 1px solid var(--border, #e4e7ed);
    border-radius: 7px;
    font-size: var(--fs-base, 13px);
    background: #fff;
    color: var(--text);
    outline: none;
    transition: border-color var(--dur-fast) ease, box-shadow var(--dur-fast) ease;
    font-family: var(--font-ui);
}
.tm-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.08);
}
.tm-input::placeholder { color: var(--muted); }

.tm-color-label {
    font-size: 11px;
    color: var(--muted, #8492a6);
    flex-shrink: 0;
    white-space: nowrap;
}

.tm-color-swatches {
    display: flex;
    gap: 5px;
    align-items: center;
    flex-wrap: wrap;
    flex: 1;
}

.tm-color-swatch {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(0,0,0,0.12);
    cursor: pointer;
    transition: transform var(--dur-fast) var(--ease-spring),
                border-color var(--dur-fast) ease,
                box-shadow var(--dur-fast) ease;
    flex-shrink: 0;
    padding: 0;
}
.tm-color-swatch:hover {
    transform: scale(1.22);
    border-color: rgba(0,0,0,0.30);
}
.tm-color-swatch.is-active {
    border-color: var(--primary, #2563eb);
    transform: scale(1.22);
    box-shadow: 0 0 0 2.5px var(--primary-dim, rgba(37,99,235,0.22));
}

.tm-color-input {
    width: 0;
    height: 0;
    opacity: 0;
    position: absolute;
    pointer-events: none;
}

.tm-add-btn {
    height: 32px;
    padding: 0 16px;
    border: none;
    border-radius: 7px;
    background: var(--primary, #2563eb);
    color: #fff;
    font-size: var(--fs-sm, 11px);
    font-weight: 600;
    cursor: pointer;
    flex-shrink: 0;
    transition: background var(--dur-fast) ease;
    font-family: var(--font-ui);
    letter-spacing: 0.02em;
}
.tm-add-btn:hover { background: var(--primary-hover, #1d4ed8); }
.tm-add-btn:disabled { opacity: 0.45; cursor: default; }

/* ── Tag grid ────────────────────────────────────────────────── */
.tm-grid {
    flex: 1;
    overflow-y: auto;
    padding: 12px 20px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
}

/* ── Tag card ───────────────────────────────── */
.tm-tag-card {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 12px 7px 8px;
    border-radius: 14px;
    background: #fff;
    border: 2px solid rgba(0,0,0,0.08);
    cursor: default;
    user-select: none;
    transition: box-shadow var(--dur-fast) ease, border-color var(--dur-fast) ease;
}
.tm-tag-card:hover {
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    border-color: rgba(0,0,0,0.16);
}
.tm-tag-card.is-selected {
    border-color: var(--primary, #2563eb);
    background: var(--primary-dim, rgba(37,99,235,0.06));
}

.tm-tag-card-cb {
    width: 15px;
    height: 15px;
    flex-shrink: 0;
    accent-color: var(--primary);
    cursor: pointer;
    margin: 0;
    opacity: 0;
    transition: opacity var(--dur-fast) ease;
}
.tm-tag-card:hover .tm-tag-card-cb,
.tm-tag-card.is-selected .tm-tag-card-cb { opacity: 1; }

/* ── Batch action bar ───────────────────────────────────────── */
.tm-batch-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px 10px;
    flex-shrink: 0;
    opacity: 0;
    transform: translateY(-4px);
    pointer-events: none;
    transition: opacity var(--dur-fast) ease, transform var(--dur-fast) ease;
}
.tm-batch-bar.is-visible {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
}

.tm-batch-bar-label {
    font-size: var(--fs-sm, 11px);
    color: var(--muted, #8492a6);
}

.tm-batch-select-all {
    font-size: var(--fs-xs, 10px);
    color: var(--primary, #2563eb);
    cursor: pointer;
    background: none;
    border: none;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: var(--font-ui);
}
.tm-batch-select-all:hover { background: var(--primary-dim, rgba(37,99,235,0.06)); }

.tm-batch-delete-btn {
    height: 28px;
    padding: 0 12px;
    border: 1px solid var(--danger, #ef4444);
    border-radius: 5px;
    background: rgba(239,68,68,0.06);
    color: var(--danger, #ef4444);
    font-size: var(--fs-sm, 11px);
    font-weight: 600;
    cursor: pointer;
    font-family: var(--font-ui);
    transition: background var(--dur-fast) ease;
}
.tm-batch-delete-btn:hover { background: rgba(239,68,68,0.14); }
.tm-batch-delete-btn:disabled { opacity: 0.4; cursor: default; }

.tm-tag-card-pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: var(--fs-xs, 10px);
    color: #fff;
    line-height: 1.4;
    white-space: nowrap;
    cursor: pointer;
    transition: filter var(--dur-fast) ease;
    font-family: var(--font-ui);
}
.tm-tag-card-pill:hover { filter: brightness(0.9); }

.tm-tag-card-name-input {
    border: none;
    outline: none;
    background: transparent;
    font-family: var(--font-ui);
    font-size: var(--fs-base, 13px);
    color: var(--text);
    min-width: 40px;
    padding: 1px 2px;
    border-radius: 3px;
    transition: background var(--dur-fast) ease;
}
.tm-tag-card-name-input:hover { background: rgba(0,0,0,0.04); }
.tm-tag-card-name-input:focus { background: rgba(0,0,0,0.06); }

.tm-tag-card-count {
    font-size: var(--fs-xs, 10px);
    color: var(--muted, #8492a6);
    white-space: nowrap;
}

.tm-tag-card-del {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--muted, #8492a6);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 0;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity var(--dur-fast) ease, color var(--dur-fast) ease, background var(--dur-fast) ease;
}
.tm-tag-card:hover .tm-tag-card-del { opacity: 1; }
.tm-tag-card-del:hover {
    color: var(--danger, #ef4444);
    background: rgba(239,68,68,0.1);
}

/* ── Empty state ─────────────────────────────────────────────── */
.tm-empty {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted, #8492a6);
    padding: 60px 20px;
}

.tm-empty-icon {
    font-size: 40px;
    opacity: 0.3;
}

.tm-empty-text {
    font-size: 14px;
}
</style>
</head>
<body>

<div class="tm-header">
    <h1>标签管理</h1>
    <span class="tm-count" id="count">0 个标签</span>
</div>

<div class="tm-toolbar">
    <div class="tm-toolbar-row">
        <input class="tm-input" id="nameInput" type="text" placeholder="新标签名称…" maxlength="32" autocomplete="off">
        <button class="tm-add-btn" id="addBtn">+ 创建</button>
    </div>
    <div class="tm-toolbar-row">
        <span class="tm-color-label">颜色</span>
        <div class="tm-color-swatches" id="swatches"></div>
        <input class="tm-color-input" id="colorInput" type="color" value="#2563eb">
    </div>
</div>

<div class="tm-batch-bar" id="batchBar">
    <span class="tm-batch-bar-label" id="batchLabel">已选 0 个</span>
    <button class="tm-batch-select-all" id="selectAllBtn">全选</button>
    <button class="tm-batch-delete-btn" id="batchDelBtn" disabled>批量删除</button>
</div>

<div class="tm-grid" id="grid"></div>

<script>
// ── Morandi palette swatches ──────────────────────────────────
const SWATCH_COLORS = [
    '#d4c9b5', '#b5c4b1', '#a8b5c8', '#c4c0d0', '#d4b896',
    '#d4a5a5', '#c4c9b6', '#b0bec5', '#d9cdb3',
    '#aea49a', '#9db09e', '#8799a8', '#a69fb5', '#bda080',
];

let currentColor = '#2563eb';
let allTags     = [];
let tagUsageMap = {};
let selectedSet = new Set();  // selected tag IDs

// ── DOM refs ──────────────────────────────────────────────────
const nameInput   = document.getElementById('nameInput');
const colorInput  = document.getElementById('colorInput');
const addBtn      = document.getElementById('addBtn');
const swatchesEl  = document.getElementById('swatches');
const gridEl      = document.getElementById('grid');
const countEl     = document.getElementById('count');
const batchBar    = document.getElementById('batchBar');
const batchLabel  = document.getElementById('batchLabel');
const selectAllBtn = document.getElementById('selectAllBtn');
const batchDelBtn  = document.getElementById('batchDelBtn');

// ── API helpers ───────────────────────────────────────────────
const apiBase = '/api';
async function apiGet(path) {
    const res = await fetch(apiBase + path);
    if (!res.ok) throw new Error(`${res.status}`);
    return res.json();
}
async function apiPost(path, body) {
    const res = await fetch(apiBase + path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    return res.json();
}
async function apiPut(path, body) {
    const res = await fetch(apiBase + path, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
    });
    if (!res.ok) throw new Error(`${res.status}`);
    return res.json();
}
async function apiDelete(path) {
    const res = await fetch(apiBase + path, { method: 'DELETE' });
    if (!res.ok) throw new Error(`${res.status}`);
}

// ── Colour swatches ───────────────────────────────────────────
function buildSwatches() {
    swatchesEl.innerHTML = '';
    SWATCH_COLORS.forEach(hex => {
        const btn = document.createElement('button');
        btn.className = 'tm-color-swatch';
        btn.style.background = hex;
        btn.title = hex;
        if (hex === currentColor) btn.classList.add('is-active');
        btn.addEventListener('click', () => {
            currentColor = hex;
            colorInput.value = hex;
            updateSwatchActive();
        });
        swatchesEl.appendChild(btn);
    });

    // Custom colour button
    const customBtn = document.createElement('button');
    customBtn.className = 'tm-color-swatch';
    customBtn.style.background = 'conic-gradient(red, yellow, lime, cyan, blue, magenta, red)';
    customBtn.title = '自定义颜色';
    customBtn.addEventListener('click', () => colorInput.click());
    swatchesEl.appendChild(customBtn);
}

function updateSwatchActive() {
    swatchesEl.querySelectorAll('.tm-color-swatch').forEach(b => {
        b.classList.toggle('is-active', b.style.background === currentColor);
    });
}

colorInput.addEventListener('input', () => {
    currentColor = colorInput.value;
    updateSwatchActive();
});

// ── Load & render ─────────────────────────────────────────────
async function loadData() {
    try {
        const [tags, notes] = await Promise.all([
            apiGet('/tags'),
            apiGet('/notes'),
        ]);
        allTags = tags;

        // Count usage per tag
        tagUsageMap = {};
        tags.forEach(t => { tagUsageMap[t.id] = 0; });
        notes.forEach(n => {
            (n.tag_ids || []).forEach(tid => {
                if (tagUsageMap[tid] !== undefined) tagUsageMap[tid]++;
            });
        });

        render();
    } catch (e) {
        console.error('Failed to load tags', e);
    }
}

function render() {
    gridEl.innerHTML = '';
    countEl.textContent = allTags.length + ' 个标签';

    if (allTags.length === 0) {
        gridEl.innerHTML = `
            <div class="tm-empty">
                <div class="tm-empty-icon">🏷️</div>
                <div class="tm-empty-text">还没有标签，在上方创建第一个吧</div>
            </div>`;
        updateBatchBar();
        return;
    }

    allTags.forEach(tag => {
        const card = document.createElement('div');
        card.className = 'tm-tag-card';
        card.dataset.id = tag.id;
        if (selectedSet.has(tag.id)) card.classList.add('is-selected');

        // Checkbox for multi-select
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'tm-tag-card-cb';
        cb.checked = selectedSet.has(tag.id);
        cb.addEventListener('click', e => {
            e.stopPropagation();
            toggleSelect(tag.id);
        });
        card.appendChild(cb);

        // Click card to toggle selection
        card.addEventListener('click', e => {
            if (e.target === cb) return;
            if (e.target.classList.contains('tm-tag-card-del')) return;
            if (e.target.classList.contains('tm-tag-card-name-input')) return;
            toggleSelect(tag.id);
        });

        // Pill preview
        const pill = document.createElement('span');
        pill.className = 'tm-tag-card-pill';
        pill.style.background = tag.color || '#8492a6';
        pill.textContent = tag.name;
        pill.title = '点击预览颜色';
        pill.addEventListener('click', e => {
            e.stopPropagation();
            currentColor = tag.color;
            colorInput.value = tag.color;
            updateSwatchActive();
        });
        card.appendChild(pill);

        // Editable name
        const nameSpan = document.createElement('input');
        nameSpan.className = 'tm-tag-card-name-input';
        nameSpan.value = tag.name;
        nameSpan.addEventListener('click', e => e.stopPropagation());
        nameSpan.addEventListener('change', async () => {
            const newName = nameSpan.value.trim();
            if (!newName || newName === tag.name) { nameSpan.value = tag.name; return; }
            try {
                await apiPut('/tags/' + tag.id, { name: newName, color: tag.color });
                tag.name = newName;
                pill.textContent = newName;
            } catch (_) {
                nameSpan.value = tag.name;
            }
        });
        card.appendChild(nameSpan);

        // Usage count
        const count = tagUsageMap[tag.id] || 0;
        if (count > 0) {
            const countSpan = document.createElement('span');
            countSpan.className = 'tm-tag-card-count';
            countSpan.textContent = count + ' 条';
            card.appendChild(countSpan);
        }

        // Delete button
        const delBtn = document.createElement('button');
        delBtn.className = 'tm-tag-card-del';
        delBtn.innerHTML = '×';
        delBtn.title = '删除标签';
        delBtn.addEventListener('click', async e => {
            e.stopPropagation();
            if (!confirm(`确定删除标签"${tag.name}"？将同时从所有便签中移除此标签。`)) return;
            try {
                await apiDelete('/tags/' + tag.id);
                selectedSet.delete(tag.id);
                await loadData();
            } catch (_) {}
        });
        card.appendChild(delBtn);

        gridEl.appendChild(card);
    });

    updateBatchBar();
}

// ── Selection & batch ops ────────────────────────────────────
function toggleSelect(tagId) {
    if (selectedSet.has(tagId)) selectedSet.delete(tagId);
    else selectedSet.add(tagId);
    refreshSelectionUI();
}

function refreshSelectionUI() {
    gridEl.querySelectorAll('.tm-tag-card').forEach(card => {
        const id = card.dataset.id;
        card.classList.toggle('is-selected', selectedSet.has(id));
        const cb = card.querySelector('.tm-tag-card-cb');
        if (cb) cb.checked = selectedSet.has(id);
    });
    updateBatchBar();
}

function updateBatchBar() {
    const n = selectedSet.size;
    batchBar.classList.toggle('is-visible', n > 0);
    batchLabel.textContent = '已选 ' + n + ' 个';
    batchDelBtn.disabled = n === 0;

    const allSelected = allTags.length > 0 && n === allTags.length;
    selectAllBtn.textContent = allSelected ? '取消全选' : '全选';
}

selectAllBtn.addEventListener('click', () => {
    if (selectedSet.size === allTags.length) {
        selectedSet.clear();
    } else {
        allTags.forEach(t => selectedSet.add(t.id));
    }
    refreshSelectionUI();
});

batchDelBtn.addEventListener('click', async () => {
    const n = selectedSet.size;
    if (n === 0) return;
    if (!confirm(`确定删除选中的 ${n} 个标签？将同时从所有便签中移除此标签。`)) return;
    batchDelBtn.disabled = true;
    let ok = 0;
    for (const id of selectedSet) {
        try { await apiDelete('/tags/' + id); ok++; } catch (_) {}
    }
    selectedSet.clear();
    await loadData();
});

// ── Create tag ────────────────────────────────────────────────
async function doCreate() {
    const name = nameInput.value.trim();
    if (!name) { nameInput.focus(); return; }
    addBtn.disabled = true;
    try {
        await apiPost('/tags', { name, color: currentColor });
        nameInput.value = '';
        nameInput.focus();
        await loadData();
    } catch (_) {}
    addBtn.disabled = false;
}

addBtn.addEventListener('click', doCreate);
nameInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') doCreate();
});

// ── Init ──────────────────────────────────────────────────────
buildSwatches();
colorInput.value = currentColor;
loadData();

// ── Relay middle-click for radial menu ───────────────────────
document.addEventListener('mousedown', function(e) {
    if (e.button !== 1) return;
    e.preventDefault();
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'iframe-mousedown', button: 1, x: e.clientX, y: e.clientY, altKey: e.altKey }, '*');
    }
});
document.addEventListener('mouseup', function(e) {
    if (e.button !== 1) return;
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'iframe-mouseup', button: 1, x: e.clientX, y: e.clientY }, '*');
    }
});
document.addEventListener('mousemove', function(e) {
    if (e.buttons !== 4) return; // middle button held
    if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'iframe-mousemove', x: e.clientX, y: e.clientY }, '*');
    }
});
</script>
</body>
</html>
