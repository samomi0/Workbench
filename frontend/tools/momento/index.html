<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Momento</title>
    <link rel="stylesheet" href="/assets/css/variables.css">
    <link rel="stylesheet" href="/assets/css/reset.css">
    <link rel="stylesheet" href="/assets/css/base.css">
    <style>
        html, body { height: 100%; }

        body {
            background: #ffffff;
            display: flex;
            flex-direction: column;
            transition: background var(--dur-base) var(--ease-out);
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 10px;
            background: rgba(255,255,255,0.55);
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .toolbar-label {
            font-size: var(--fs-xs);
            font-weight: 600;
            letter-spacing: 0.07em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .bg-swatches {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .bg-swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            border: 1.5px solid var(--border);
            cursor: pointer;
            transition:
                border-color var(--dur-fast) ease,
                transform    var(--dur-fast) var(--ease-spring);
        }

        .bg-swatch.is-active {
            border-color: var(--primary);
            transform: scale(1.25);
        }

        /* Saved state indicator */
        .status-dot {
            margin-left: auto;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: transparent;
            transition: background var(--dur-fast) ease;
            flex-shrink: 0;
        }

        .status-dot.is-dirty { background: var(--muted); }
        .status-dot.is-saved { background: #22c55e; }

        /* Note area */
        .note {
            flex: 1;
            width: 100%;
            padding: 12px 14px;
            border: none;
            resize: none;
            outline: none;
            font-family: var(--font-ui);
            font-size: var(--fs-base);
            color: var(--text);
            line-height: 1.65;
            background: transparent;
            caret-color: var(--primary);
        }

        .note::placeholder { color: var(--muted); opacity: 0.55; }
    </style>
</head>
<body>
    <div class="toolbar">
        <span class="toolbar-label">Memo</span>
        <div class="bg-swatches" id="swatches"></div>
        <span class="status-dot" id="status-dot"></span>
    </div>
    <textarea class="note" id="note" placeholder="Start typing..."></textarea>

    <script>
    var KEY_TEXT = 'wb-momento-text';
    var KEY_BG   = 'wb-momento-bg';
    var COLORS   = ['#ffffff', '#fef9c3', '#dcfce7', '#e0f2fe', '#f3e8ff', '#ffe4e6'];

    var swatchesEl = document.getElementById('swatches');
    var noteEl     = document.getElementById('note');
    var dotEl      = document.getElementById('status-dot');
    var saveTimer  = null;

    var activeBg = localStorage.getItem(KEY_BG) || COLORS[0];

    function applyBg(color) {
        document.body.style.background = color;
    }

    function setActiveSwatch(color) {
        activeBg = color;
        localStorage.setItem(KEY_BG, color);
        applyBg(color);
        swatchesEl.querySelectorAll('.bg-swatch').forEach(function(s) {
            s.classList.toggle('is-active', s.dataset.color === color);
        });
    }

    COLORS.forEach(function(c) {
        var btn = document.createElement('button');
        btn.className = 'bg-swatch' + (c === activeBg ? ' is-active' : '');
        btn.dataset.color = c;
        btn.style.background = c;
        btn.title = c;
        btn.addEventListener('click', function() { setActiveSwatch(c); });
        swatchesEl.appendChild(btn);
    });

    applyBg(activeBg);

    noteEl.value = localStorage.getItem(KEY_TEXT) || '';

    noteEl.addEventListener('input', function() {
        dotEl.className = 'status-dot is-dirty';
        clearTimeout(saveTimer);
        saveTimer = setTimeout(function() {
            localStorage.setItem(KEY_TEXT, noteEl.value);
            dotEl.className = 'status-dot is-saved';
            setTimeout(function() { dotEl.className = 'status-dot'; }, 1400);
        }, 600);
    });

    // Listen for commands from the parent app (via postMessage)
    window.addEventListener('message', function(e) {
        if (!e.data || typeof e.data !== 'object') return;
        if (e.data.type === 'create') {
            // Save current note, clear and focus for a new one
            clearTimeout(saveTimer);
            localStorage.setItem(KEY_TEXT, noteEl.value);
            noteEl.value = '';
            noteEl.focus();
            dotEl.className = 'status-dot';
        }
    });

    // Relay middle-click mousedown/mouseup for radial menu drag support
    document.addEventListener('mousedown', function(e) {
        if (e.button !== 1) return;
        e.preventDefault(); // prevent browser auto-scroll cursor
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'iframe-mousedown',
                button: 1,
                x: e.clientX,
                y: e.clientY,
            }, '*');
        }
    });

    document.addEventListener('mouseup', function(e) {
        if (e.button !== 1) return;
        if (window.parent && window.parent !== window) {
            window.parent.postMessage({
                type: 'iframe-mouseup',
                button: 1,
                x: e.clientX,
                y: e.clientY,
            }, '*');
        }
    });

    var _mmRaf = null;
    document.addEventListener('mousemove', function(e) {
        if (!window.parent || window.parent === window) return;
        // Throttle to one postMessage per animation frame
        if (_mmRaf) return;
        var cx = e.clientX, cy = e.clientY;
        _mmRaf = requestAnimationFrame(function() {
            _mmRaf = null;
            window.parent.postMessage({ type: 'iframe-mousemove', x: cx, y: cy }, '*');
        });
    });

    noteEl.focus();
    </script>
</body>
</html>
